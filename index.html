<style>:root{
  --ground:#f3f5f4; --surface:#ffffff; --sunk:#e9edec; --ink:#172027; --ink2:#46535c; --muted:#5f6c75; --line:#d6dddc; --line2:#e4e9e8;
  --tokyo:#2d5288; --tokyo-soft:#e1e8f3; --tokyo-ink:#234272;
  --kyoto:#b3452c; --kyoto-soft:#f6e2dc; --kyoto-ink:#943620;
  --kanazawa:#8c6b10; --kanazawa-soft:#f2e9cf; --kanazawa-ink:#6e540b;
  --takayama:#3b6d44; --takayama-soft:#dfece1; --takayama-ink:#2d5634;
  --onsen:#2a6f78; --onsen-soft:#dbebed; --onsen-ink:#1f5960;
  --matsumoto:#6d4a7c; --matsumoto-soft:#ece2f0; --matsumoto-ink:#573a64;
  --ok:#256b41; --ok-soft:#dff0e5; --warn:#9a5b00; --warn-soft:#fbecd3; --bad:#b02a2a;
  --focus:#2d5288;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(23,32,39,.06),0 6px 18px -8px rgba(23,32,39,.14);
  --f-ui:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --navh:58px;
  --glass:rgba(255,255,255,.6); --glass-edge:rgba(23,32,39,.10); --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(255,255,255,.35);
  --glass-sheen:rgba(255,255,255,.55); --glass-pill:rgba(23,32,39,.075); --glass-lens:rgba(255,255,255,.38);
  --float:0 10px 30px -10px rgba(16,40,52,.28),0 2px 6px -2px rgba(16,40,52,.12);
  --out:cubic-bezier(.2,.8,.2,1);
  --snap:cubic-bezier(.3,1.15,.5,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0e1316; --surface:#161d22; --sunk:#1c252b; --ink:#e6ebed; --ink2:#c2ccd1; --muted:#9aa7ae; --line:#2a353c; --line2:#222c32;
  --tokyo:#86a8de; --tokyo-soft:#172338; --tokyo-ink:#aec6ee;
  --kyoto:#ee8b72; --kyoto-soft:#381b14; --kyoto-ink:#f4ae9c;
  --kanazawa:#d9b75c; --kanazawa-soft:#30270f; --kanazawa-ink:#e9cf89;
  --takayama:#80c08a; --takayama-soft:#152c1a; --takayama-ink:#a8d8af;
  --onsen:#6bbfc7; --onsen-soft:#102c2e; --onsen-ink:#9bd5db;
  --matsumoto:#bb98cd; --matsumoto-soft:#2a1e32; --matsumoto-ink:#d4bce0;
  --ok:#5cc288; --ok-soft:#15301f; --warn:#e3a54a; --warn-soft:#352612; --bad:#f07a7a;
  --focus:#86a8de; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6);
  --glass:rgba(30,38,44,.58); --glass-edge:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.22); --glass-lo:rgba(255,255,255,.06);
  --glass-sheen:rgba(255,255,255,.10); --glass-pill:rgba(255,255,255,.11); --glass-lens:rgba(255,255,255,.16);
  --float:0 12px 34px -10px rgba(0,0,0,.7),0 2px 8px -2px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0e1316; --surface:#161d22; --sunk:#1c252b; --ink:#e6ebed; --ink2:#c2ccd1; --muted:#9aa7ae; --line:#2a353c; --line2:#222c32;
  --tokyo:#86a8de; --tokyo-soft:#172338; --tokyo-ink:#aec6ee;
  --kyoto:#ee8b72; --kyoto-soft:#381b14; --kyoto-ink:#f4ae9c;
  --kanazawa:#d9b75c; --kanazawa-soft:#30270f; --kanazawa-ink:#e9cf89;
  --takayama:#80c08a; --takayama-soft:#152c1a; --takayama-ink:#a8d8af;
  --onsen:#6bbfc7; --onsen-soft:#102c2e; --onsen-ink:#9bd5db;
  --matsumoto:#bb98cd; --matsumoto-soft:#2a1e32; --matsumoto-ink:#d4bce0;
  --ok:#5cc288; --ok-soft:#15301f; --warn:#e3a54a; --warn-soft:#352612; --bad:#f07a7a;
  --focus:#86a8de; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6);
  --glass:rgba(30,38,44,.58); --glass-edge:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.22); --glass-lo:rgba(255,255,255,.06);
  --glass-sheen:rgba(255,255,255,.10); --glass-pill:rgba(255,255,255,.11); --glass-lens:rgba(255,255,255,.16);
  --float:0 12px 34px -10px rgba(0,0,0,.7),0 2px 8px -2px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--f-ui);margin:0}
::selection{background:var(--tokyo-soft);color:var(--ink)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--navh) + 56px + env(safe-area-inset-bottom,0px))}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 14px}
.top .brand{font:400 1.5rem/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.top .brand .arr{color:var(--muted);font-family:var(--f-ui);font-weight:600;margin-inline:.25em}
.top .sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
#save{font-size:.82rem;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
#save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
#save[data-state=live]::before,#save[data-state=saved]::before{background:var(--ok)}
#save[data-state=saving]::before{background:var(--warn)}
#save[data-state=error]::before,#save[data-state=full]::before{background:var(--bad)}
#save[data-state=readonly]::before,#save[data-state=local]::before{background:var(--line)}

/* calendar */
.cal{display:grid;gap:10px;margin-bottom:18px}
.calrow{display:grid;gap:6px}
.calcity{font-weight:700;font-size:.95rem;display:flex;align-items:baseline;gap:8px}
.calcity small{font-weight:400;color:var(--muted);font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{--c:var(--tokyo);--soft:var(--tokyo-soft);position:relative;display:grid;justify-items:center;align-content:center;gap:0;min-height:62px;padding:6px 2px 8px;border:0;cursor:pointer;
  background:var(--surface);color:var(--ink);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);
  box-shadow:inset 0 0 0 1px var(--line);transition:background-color .18s ease,color .18s ease}
/* a travel day: the region being left in the reading-start corner, the next one in the other */
.tile.split{background:linear-gradient(225deg,var(--s1) 0 50%,var(--soft) 50% 100%)}
.tile::after{content:"";position:absolute;top:0;inset-inline-end:0;width:17px;height:17px;background:linear-gradient(225deg,var(--c) 0 50%,transparent 50%);opacity:.9}
[dir=rtl] .tile{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px)}
[dir=rtl] .tile::after{inset-inline-end:auto;left:0;background:linear-gradient(135deg,var(--c) 0 50%,transparent 50%)}
.tile .wd{font-size:.78rem;color:var(--muted);line-height:1.2}
.tile .dn{font:400 1.45rem/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.tile .pips{position:absolute;inset-inline:8px;bottom:6px;height:3px;border-radius:2px;background:transparent}
.tile .pips i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--c);border-radius:2px;opacity:.55}
@media (hover:hover){.tile:hover{background:var(--soft)}}
@media (hover:hover){.tile.split:hover{background:linear-gradient(225deg,var(--s1) 0 50%,var(--soft) 50% 100%)}}
.tile.sel{background:var(--c);color:#fff;box-shadow:none}
.tile.sel .wd{color:rgba(255,255,255,.85)}
.tile.sel .pips i{background:#fff}
.tile.sel::after{opacity:0}
.tile.split.sel{background:linear-gradient(225deg,var(--c1) 0 50%,var(--c) 50% 100%)}
.tile.today .dn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile.sel{color:#0e1316}:root:not([data-theme="light"]) .tile.sel .wd{color:rgba(14,19,22,.75)}:root:not([data-theme="light"]) .tile.sel .pips i{background:#0e1316}}
:root[data-theme="dark"] .tile.sel{color:#0e1316}
:root[data-theme="dark"] .tile.sel .wd{color:rgba(14,19,22,.75)}
:root[data-theme="dark"] .tile.sel .pips i{background:#0e1316}

/* day */
.day{--c:var(--tokyo);--soft:var(--tokyo-soft);--cink:var(--tokyo-ink)}
.dayhead{display:flex;gap:14px;align-items:center;margin:6px 0 10px}
.dayno{flex:none;width:58px;height:58px;display:grid;place-items:center;background:var(--c);color:#fff;
  clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px)}
.day.split .dayno{background:linear-gradient(225deg,var(--c1) 0 50%,var(--c) 50% 100%)}
.dayno span{font:400 .95rem/1 var(--f-display);text-align:center;padding-inline:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dayno{color:#0e1316}}
:root[data-theme="dark"] .dayno{color:#0e1316}
.dayhead h1{font:700 1.35rem/1.2 var(--f-ui);margin:0;text-wrap:balance}
.daytitle{margin:2px 0 0;color:var(--cink);font-weight:600}
.brief{margin:0 0 14px;color:var(--ink2);max-width:62ch}

/* item rows */
.timeline,.todo,.places,.areas,.checks{list-style:none;margin:0;padding:0}
.timeline{display:grid;gap:0;border-top:1px solid var(--line2)}
.it{display:grid;grid-template-columns:52px 44px minmax(0,1fr) 40px;gap:0 8px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line2)}
.todo .it,.places .it{grid-template-columns:44px minmax(0,1fr) 40px}
.it .tm{font-weight:700;font-variant-numeric:tabular-nums;padding-top:10px;color:var(--cink,var(--ink2));font-size:.95rem}
.chk{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;cursor:pointer;padding:0}
.chk .ic{width:26px;height:26px;padding:3px;border-radius:8px;box-shadow:inset 0 0 0 1.75px var(--line);stroke:transparent;stroke-width:2.5;transition:background-color .15s ease,box-shadow .15s ease}
@media (hover:hover){.chk:hover .ic{box-shadow:inset 0 0 0 1.75px var(--muted)}}
.chk[aria-checked=true] .ic{background:var(--ok);box-shadow:none;stroke:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chk[aria-checked=true] .ic{stroke:#0e1316}}
:root[data-theme="dark"] .chk[aria-checked=true] .ic{stroke:#0e1316}
.it .body{min-width:0;padding-top:8px}
.ttl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-weight:700;line-height:1.35}
.ttl .lock{width:16px;height:16px;color:var(--cink,var(--muted))}
.it.done .ttl>span:first-of-type,.it.done .ttl>span{color:var(--muted)}
.it.done .ttl>span:not(.pill):not(.price){text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--muted)}
.it.fixed .ttl{color:var(--cink)}
.desc{margin:4px 0 0;color:var(--ink2);font-size:.95rem;max-width:62ch}
.desc b{color:var(--ink);font-weight:700}
.unote{display:flex;gap:6px;margin:6px 0 0;padding:6px 10px;background:var(--sunk);border-radius:var(--r-sm);font-size:.92rem;color:var(--ink)}
.unote .ic{width:16px;height:16px;margin-top:3px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;padding:2px 8px 2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.tag .ic{width:14px;height:14px}
/* categories stay neutral; color is reserved for state: have a ticket (green), still to book (amber) */
.t-ticket{background:var(--ok-soft);color:var(--ok)} .t-book{background:var(--warn-soft);color:var(--warn)}

.gf-full{background:var(--ok-soft);color:var(--ok)} .gf-menu{background:none;color:var(--ok);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ok) 55%,transparent)} .gf-opts{background:var(--sunk);color:var(--ink2)}
.links{display:flex;flex-wrap:wrap;gap:0 18px;margin-top:2px}
.links a,.linkbtn{display:inline-flex;align-items:center;gap:5px;min-height:44px;font-size:.92rem;font-weight:600;color:var(--cink,var(--tokyo-ink));text-decoration:none;border:0;background:none;padding:0;cursor:pointer}
.links a .ic,.linkbtn .ic{width:17px;height:17px}
@media (hover:hover){.links a:hover,.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}}
.more{width:40px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px}
.more .ic{width:18px;height:18px}
@media (hover:hover){.more:hover{background:var(--sunk);color:var(--ink)}}
.more.sm{height:40px}
body.ro .more,body.ro .addbtn,body.ro [data-bnote]{display:none}
body.ro .chk{pointer-events:none}
.pill{font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.price{font-weight:600;color:var(--muted);font-size:.85rem;letter-spacing:.04em}

/* editor */
.it.editing{display:block;padding:12px 0}
.ed{display:flex;flex-wrap:wrap;gap:10px;padding:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.ed label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--ink2)}
.ed label.grow{flex:1 1 220px} .ed label.full{flex:1 1 100%}
.ed input,.ed textarea,.notes textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;min-height:44px;width:100%}
.ed input[type=time]{width:auto;min-width:0}
.ed textarea,.notes textarea{resize:vertical;line-height:1.45}
.ed input:focus,.ed textarea:focus,.notes textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.edact{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 100%}
.primary,.ghost,.danger,.addbtn{min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:0}
.primary{background:var(--ink);color:var(--ground)}
.ghost{background:var(--sunk);color:var(--ink)}
.danger{background:none;color:var(--bad);margin-inline-start:auto}
@media (hover:hover){.primary:hover{opacity:.9} .ghost:hover{background:var(--line2)}}
.reset{flex:1 1 100%;min-height:32px;color:var(--muted)}
.addbtn{width:100%;justify-content:center;margin-top:10px;background:none;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px}
@media (hover:hover){.addbtn:hover{box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--ink)}}
.addbtn .ic{width:18px;height:18px}

.notes{display:grid;gap:6px;margin-top:22px;font-weight:700;font-size:.95rem}
.notes textarea{font-weight:400}
.daynav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.daynav .ghost .ic{width:18px;height:18px}

/* pages */
.pageh{font:400 1.7rem/1.15 var(--f-display);margin:8px 0 6px;letter-spacing:-.01em}
.lede{margin:0 0 16px;color:var(--ink2);max-width:62ch}
.sech{font:700 1.15rem/1.3 var(--f-ui);margin:28px 0 8px}

/* tickets */
.tickets{display:grid;gap:12px}
.ticket{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;position:relative}
.tk-top{display:flex;gap:12px;align-items:flex-start}
.tk-top>.ic{width:26px;height:26px;color:var(--tokyo-ink);margin-top:2px}
.tk-top h3{margin:0;font-size:1.08rem;line-height:1.3}
.tk-top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.tk-route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:14px 0 10px;padding-block:12px;border-block:1.5px dashed var(--line)}
.tk-route>div:not(.tk-mid){display:grid}
.tk-route b{font:400 1.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tk-route span{font-size:.85rem;color:var(--muted)}
.tk-route>div:last-child{text-align:end}
.tk-mid{text-align:center;font-size:.82rem;color:var(--muted);position:relative}
.tk-mid::before{content:"";display:block;height:1.5px;background:var(--line);margin-bottom:4px}
.tk-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 16px;margin:10px 0 0}
.tk-facts div{min-width:0}
.tk-facts dt{font-size:.8rem;color:var(--muted)}
.tk-facts dd{margin:0;font-weight:600;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.code{font-variant-numeric:tabular-nums;letter-spacing:.06em;direction:ltr;unicode-bidi:isolate}
.copy{width:44px;height:44px;display:inline-grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px}
@media (hover:hover){.copy:hover{background:var(--sunk);color:var(--ink)}}
.copy .ic{width:17px;height:17px}
.copy.copied{color:var(--ok)}
.missing{display:flex;gap:6px;align-items:flex-start;margin:10px 0 0;padding:8px 10px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:.92rem}
.missing .ic{width:18px;height:18px;margin-top:2px}
.ticket .ed{box-shadow:none;background:var(--ground);margin-top:10px}

/* segmented */
.seg{position:relative;display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;margin:18px 0 4px}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;min-height:40px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-selected=true]{color:var(--ink)}

/* packing */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}

.info{display:grid;gap:0}

bdi,.ltr{unicode-bidi:isolate}

/* nav: a floating Liquid Glass tab bar as in iOS 26. What scrolls under it shows through, blurred;
   a glass pill sits on the current tab. Press and slide along the bar: the pill grows into a lens,
   follows the finger, and the tab under it opens on release. */
.nav{position:fixed;z-index:10;inset-inline:max(14px,env(safe-area-inset-left,0px));bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 12px));
  max-width:520px;margin:0 auto;border-radius:999px;isolation:isolate;
  background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.9) brightness(1.04);backdrop-filter:blur(12px) saturate(1.9) brightness(1.04);
  box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 1px var(--glass-hi),inset 0 -1px 1px var(--glass-lo),var(--float);
  transition:translate .22s var(--out),opacity .18s ease}
/* the sheen along the top rim */
.nav::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(to bottom,var(--glass-sheen),transparent 42%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav{background:color-mix(in srgb,var(--surface) 96%,transparent)}}
.nav-in{position:relative;display:grid;grid-template-columns:repeat(5,1fr);padding:4px;touch-action:none}
.nav-ind{position:absolute;inset-block:4px;inset-inline-start:4px;width:calc((100% - 8px) / 5);border-radius:999px;pointer-events:none;
  background:var(--glass-pill);box-shadow:inset 0 1px 0 var(--glass-lo);
  translate:calc(var(--ti,0) * -100%) 0;transition:translate .3s var(--snap),scale .2s var(--out),background-color .2s ease,box-shadow .2s ease}
[dir=ltr] .nav-ind{translate:calc(var(--ti,0) * 100%) 0}
.nav-in.press .nav-ind{scale:1.1 1.16;background:var(--glass-lens);box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 1px var(--glass-hi),0 6px 16px -6px rgba(0,0,0,.3)}
.nav-in.drag .nav-ind{transition:scale .2s var(--out),background-color .2s ease,box-shadow .2s ease}
.nav button{position:relative;z-index:1;min-height:var(--navh);border:0;background:none;display:grid;justify-items:center;align-content:center;gap:1px;font-size:.76rem;font-weight:600;color:var(--ink2);cursor:pointer;padding:4px 0;border-radius:999px;transition:color .15s ease}
.nav button .ic{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--tokyo)}
.nav button[aria-current=page] .ic{stroke-width:2.1}
/* typing: the keyboard takes the bottom of the screen, so the bar steps aside */
body:has(#view :is(input,textarea):focus) .nav{translate:0 calc(100% + 40px);opacity:0;pointer-events:none}

@media (min-width:640px){
  .tile{min-height:70px}

}
@media (max-width:360px){

/* app shell additions */
.wrap{padding-top:env(safe-area-inset-top,0px)}
#save[data-state=offline]::before{background:var(--warn)}
#save[data-state=nosync]::before{background:var(--warn)}
#install{display:flex;gap:12px;align-items:center;margin:0 0 16px;padding:12px 14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
#install[hidden]{display:none}
#install img{width:44px;height:44px;border-radius:10px;flex:none}
#install p{margin:0;font-size:.92rem;color:var(--ink2);flex:1}

#install .primary{min-height:40px;padding:0 14px;flex:none}

@media (hover:hover){#install .x:hover{background:var(--sunk)}}

/* booking categories */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--sunk);color:var(--ink2);font-weight:700;font-size:.92rem;cursor:pointer}

@media (hover:hover){.chip:hover{background:var(--line2)}}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ground)}
.cnt-dot{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:.75rem;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true] .cnt-dot{background:var(--warn);color:var(--ground)}
.bcat-h{display:flex;align-items:center;gap:8px}

.subh{font-size:.95rem;color:var(--ink2);margin:16px 0 4px}

/* undo bar + jump highlight */
#toast{position:fixed;z-index:20;inset-inline:16px;bottom:calc(var(--navh) + 30px + max(10px,calc(env(safe-area-inset-bottom,0px) - 12px)));max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;padding-inline-start:16px;border-radius:16px;background:var(--ink);color:var(--ground);box-shadow:var(--float);font-weight:600}
#toast[hidden]{display:none}
#toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:9px;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.flash{animation:flash 1.8s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--focus)}100%{box-shadow:0 0 0 3px transparent}}

/* photos */
.pic{display:block;position:relative;width:100%;max-width:460px;aspect-ratio:16/9;margin:10px 0 4px;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--sunk);cursor:zoom-in}
.pic img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
@media (hover:hover){.pic:hover img{transform:scale(1.03)}}
.it.done .pic img{filter:grayscale(.7);opacity:.6}
.area .pic{max-width:none}
.ticket .pic.wide{width:calc(100% + 32px);max-width:none;margin:-14px -16px 14px;border-radius:var(--r) var(--r) 0 0;aspect-ratio:2/1}

.dayhead.has-hero{display:block;position:relative;margin:4px 0 14px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}

.has-hero .dayhead-t{position:absolute;inset-inline:0;bottom:0;align-items:flex-end;padding:56px 14px 14px;background:linear-gradient(to top,rgba(8,12,16,.82),rgba(8,12,16,.45) 55%,transparent);color:#fff;pointer-events:none}
.has-hero h1{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.has-hero .daytitle{color:rgba(255,255,255,.92)}
.has-hero .dayno{width:52px;height:52px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .has-hero .dayno{color:#0e1316}}

/* photo viewer */
#lb{padding:0;border:0;background:transparent;max-width:min(94vw,900px);max-height:92vh;overflow:visible;color:#fff}
#lb::backdrop{background:rgba(6,9,12,.94)}

#lb figcaption b{font-size:1.05rem}
#lb figcaption span{color:rgba(255,255,255,.75)}
#lb figcaption a{color:#fff}
.lb-x{position:absolute;top:-52px;inset-inline-end:0;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.lb-x .ic{width:22px;height:22px}
.credits{padding-inline-start:18px;font-size:.88rem}
.credits li{margin:3px 0}

/* header: city names in their calendar colors */
/* region colors: tiles, the day, its stations, labels */
.r-tokyo{--c:var(--tokyo);--soft:var(--tokyo-soft);--cink:var(--tokyo-ink)}
.r-kyoto{--c:var(--kyoto);--soft:var(--kyoto-soft);--cink:var(--kyoto-ink)}
.r-kanazawa{--c:var(--kanazawa);--soft:var(--kanazawa-soft);--cink:var(--kanazawa-ink)}
.r-takayama{--c:var(--takayama);--soft:var(--takayama-soft);--cink:var(--takayama-ink)}
.r-onsen{--c:var(--onsen);--soft:var(--onsen-soft);--cink:var(--onsen-ink)}
.r-matsumoto{--c:var(--matsumoto);--soft:var(--matsumoto-soft);--cink:var(--matsumoto-ink)}
.c-tokyo{color:var(--tokyo-ink)} .c-kyoto{color:var(--kyoto-ink)} .c-kanazawa{color:var(--kanazawa-ink)} .c-takayama{color:var(--takayama-ink)} .c-onsen{color:var(--onsen-ink)} .c-matsumoto{color:var(--matsumoto-ink)}

/* the day as a metro line: the line runs through the check column; checking a stop fills it */
.timeline{--tmw:52px;--gap:8px;--mid:34px;border-top:0;margin-top:4px}
.timeline .it{position:relative;border-bottom:0;padding:12px 0 14px}
.timeline .it::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:calc(var(--tmw) + var(--gap) + 20px);width:4px;border-radius:2px;background:var(--c);opacity:.28}
.timeline .it.done::before{opacity:1}
.timeline .it:first-child::before{top:var(--mid)}
.timeline .it:last-child::before{bottom:auto;height:var(--mid)}
.timeline .it:only-child::before{display:none}
.timeline .chk{position:relative;z-index:1}
.timeline .chk .ic{width:28px;height:28px;padding:4px;border-radius:50%;background:var(--ground);box-shadow:inset 0 0 0 3.5px var(--c)}
@media (hover:hover){.timeline .chk:hover .ic{background:var(--soft)}}
.timeline .chk[aria-checked=true] .ic{background:var(--c);box-shadow:none}
.timeline .it.fixed .chk .ic{box-shadow:inset 0 0 0 3.5px var(--c),0 0 0 3px var(--ground),0 0 0 5.5px var(--c)}
.timeline .it.minor .chk .ic{width:20px;height:20px;padding:2px;box-shadow:inset 0 0 0 3px var(--c)}
.timeline .it.minor .ttl{font-weight:600}

.pill.now{background:var(--c);color:#fff}

@keyframes ping{0%{box-shadow:inset 0 0 0 3.5px var(--c),0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}100%{box-shadow:inset 0 0 0 3.5px var(--c),0 0 0 12px transparent}}
.timeline .it.editing::before{display:none}
@media (max-width:360px){.timeline{--tmw:44px;--gap:6px}.timeline .it::before{inset-inline-start:calc(var(--tmw) + var(--gap) + 18px)}}

/* previous / next day */
.daynav{align-items:stretch}
.dnav{--c:var(--tokyo);flex:0 1 50%;min-height:60px;display:flex;align-items:center;gap:8px;padding:8px 12px;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);text-align:start;cursor:pointer}

@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.primary:active,.ghost:active,.addbtn:active,.chip:active,.seg button:active,.dnav:active,.nav button:active,#toast button:active{transform:scale(.97)}

#view:focus{outline:none}
#lb figcaption small{color:rgba(255,255,255,.75);font-size:.85rem}

/* iPhone pass: touch feel */
html{-webkit-tap-highlight-color:transparent;background:var(--ground)}
button,.tile,.nav,.chip,summary{touch-action:manipulation;-webkit-user-select:none;user-select:none}

/* motion: short and quiet. Presses answer at once, nothing waits on an animation, and only
   transform and opacity move, so the compositor can run it at the screen's refresh rate. */
.primary,.ghost,.addbtn,.chip,.seg button,.dnav,.tile,.linkbtn,.copy,.more,.pic,#toast button{transition:transform .16s var(--out),background-color .15s ease,box-shadow .15s ease,color .15s ease}
.primary:active,.ghost:active,.addbtn:active,.chip:active,.seg button:active,.dnav:active,#toast button:active{transform:scale(.97);transition-duration:.05s}
.tile:active{transform:scale(.95);transition-duration:.05s}
.pic:active{transform:scale(.985);transition-duration:.05s}

.seg-thumb{will-change:transform}

/* Japan: the sheet vs. suggestions. A stop from the sheet is a solid station; a suggestion is a dashed one on
   a dashed stretch of line, with a dashed "הצעה" label, as the old page drew suggestions in a dashed frame. */
.calcity{flex-wrap:wrap;gap:2px 8px}

.t-red{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.t-check{background:var(--warn-soft);color:var(--warn)}
.timeline .it.sug::before{background:repeating-linear-gradient(to bottom,var(--c) 0 6px,transparent 6px 11px)}
.timeline .it.sug .chk .ic{box-shadow:none;border:2.5px dashed var(--c)}
.timeline .it.sug.minor .chk .ic{border-width:2px}
.timeline .it.sug .chk[aria-checked=true] .ic{border-style:solid;background:var(--c)}
.timeline .it.sug.next .chk .ic{animation:none}
.tm.when{font-weight:600;font-size:.85rem;line-height:1.3}
.sheet{display:flex;flex-wrap:wrap;gap:2px 8px;margin:0 0 8px;font-size:.88rem;color:var(--muted)}
.sheet>span{font-weight:700;color:var(--ink2)}
.tip{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin:6px 0 0;font-size:.92rem;color:var(--ink2);max-width:62ch}
.codeline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 0;font-size:.92rem;color:var(--ink2)}
.codeline .code{font-weight:700;color:var(--ink)}
.ph .es[lang=ja]{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-weight:600;text-align:left}
.ph .ro{margin:2px 0 0;grid-column:1;text-align:left;color:var(--ink2);font-size:.9rem}
.ph .copy{grid-row:1/4}
.tbl{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:.9rem}
.tbl th{padding:4px 6px 6px;text-align:start;font-size:.8rem;font-weight:600;color:var(--muted)}
.tbl td{padding:8px 6px;border-top:1px solid var(--line2);vertical-align:top}
.tbl td:first-child,.tbl td:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.tbl td:last-child,.tbl th:last-child{text-align:end}
.tbl tfoot td{border-top:1.5px solid var(--line)}
.k{display:inline-block;margin-inline-start:4px;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--ink2);font-size:.72rem;font-weight:700;white-space:nowrap}
.k.jr{background:var(--ok-soft);color:var(--ok)}
.tip.allsug{margin:0 0 12px}
.opts{margin:4px 0 6px;padding-inline-start:20px;color:var(--ink2)}
.opts li{margin:2px 0}
.opts li.pref{color:var(--ink);font-weight:700}
.opts small{margin-inline-start:6px;font-size:.78rem;font-weight:600;color:var(--muted)}
/* English place names inside Hebrew lists: each name is its own run, so commas don't shuffle them */
.desc b,.tip b,.brief b,.inf-b b,.steps b,.ttl bdi{unicode-bidi:isolate}
/* the three-city route is longer than "ברצלונה ← מדריד": the sync status may take two short lines */
.top>div{min-width:0}
#save{white-space:normal;max-width:8.5em;line-height:1.25;text-align:start;flex:0 1 auto}
#save::before{flex:none}
@media (max-width:360px){.top .brand{font-size:1.3rem}}
</style>
</head>

    <ol class="timeline">${items.map((it, i) => itemRow(it, { hero, allSug, cls: stationCls(d, items, i) })).join("")}</ol>
    ${addRow(list, "הוספת פעילות ליום")}
    <label class="notes"><span>הערות ליום</span>
      <textarea id="note-${d.date}" data-note="${d.date}" rows="3" placeholder="מה היה, מה לזכור, לאן לחזור">${esc((S.notes[d.date] || {}).text || "")}</textarea>
    </label>
    <nav class="daynav">
      ${idx > 0 ? dayNavBtn(DATA.days[idx - 1], idx - 1, "prev") : "<span></span>"}
      ${idx < DATA.days.length - 1 ? dayNavBtn(DATA.days[idx + 1], idx + 1, "next") : "<span></span>"}
    </nav>
    <p class="swipehint">אפשר גם להחליק ימינה ושמאלה בין הימים</p>
  </section>`;
}
// The day's plan is drawn as a metro line: each item a station, colored by the region it happens in.
// On a travel day the stops up to the train or bus are on the line of the region being left.
function stationCls(d, items, i) {
  const it = items[i], c = [];
  if (d.from) { const t = items.findIndex(x => x.id === d.switchAt); if (t >= 0 && i <= t) c.push("r-" + d.from); }
  const tags = it.tags || [];
  if ((tags.includes("rest") || (tags.includes("move") && !it.book)) && it.kind !== "fixed") c.push("minor");
  if (it.sug) c.push("sug");
  if (d.date === todayIso() && !it.done && it.id === nextStop(items)) c.push("next");
  return c.join(" ");
}
function nextStop(items) {
  const now = jpNow().hm;
  const open = items.filter(x => !x.done), at = x => x.time || (x.when && x.sk);
  // the latest open item that has started, else the first one still ahead
  const started = open.filter(x => at(x) && at(x) <= now).pop();
  return (started || open.find(x => at(x)) || {}).id;
}
function dayNavBtn(d, i, dir) {
  return `<button class="dnav ${dir} r-${d.city}" data-day="${d.date}">${dir === "prev" ? ico("chev-r") : ""}<span><small>${dir === "prev" ? "היום הקודם" : "היום הבא"}, יום ${i + 1}</small><b>${esc(d.title)}</b></span>${dir === "next" ? ico("chev-l") : ""}</button>`;
}
function tagChip(t) {
  const T = DATA.tags[t]; if (!T) return "";
  return `<span class="tag t-${t}">${ico(T.icon)}${T.label}</span>`;
}
function linksOf(it) {
  const L = [];
  if (it.map) L.push(`<a href="${mapUrl(it.map)}" target="_blank" rel="noopener">${ico("pin")}מפה</a>`);
  if (it.url) L.push(`<a href="${esc(it.url)}" target="_blank" rel="noopener">${ico("ext")}${esc(it.urlLabel || "אתר")}</a>`);
  if (it.book) {
    const have = DATA.bookings.some(b => b.id === it.book), b = item(it.book);
    L.push(`<button class="linkbtn" data-goto-book="${it.book}">${ico("ticket")}${have ? "פרטי ההזמנה" : b.done ? "הוזמן" : "צריך להזמין"}</button>`);
  }
  return L.length ? `<div class="links">${L.join("")}</div>` : "";
}
// additions that are not in the sheet carry this label, as on the old page
const SUG = `<span class="pill sug">הצעה</span>`;
function itemRow(it, opts = {}) {
  if (S.editing === it.id) return `<li class="it editing">${editor(it)}</li>`;
  const fixed = it.kind === "fixed";
  return `<li class="it${it.done ? " done" : ""}${fixed ? " fixed" : ""}${opts.cls ? " " + opts.cls : ""}" id="it-${it.id}">
    ${opts.noTime ? "" : `<div class="tm${!it.time && it.when ? " when" : ""}">${esc(it.time || it.when || "")}</div>`}
    <button class="chk" data-toggle="${it.id}" role="checkbox" aria-checked="${!!it.done}" aria-label="${it.done ? "בוצע" : "סמן כבוצע"}: ${esc(it.title)}">${ico("check")}</button>
    <div class="body">
      <div class="ttl">${fixed ? ico("lock", "lock") : ""}<span>${esc(it.title)}</span>${(opts.cls || "").includes("next") ? `<span class="pill now">הבא</span>` : ""}${it.sug && !opts.allSug ? SUG : ""}</div>
      ${(it.tags || []).length ? `<div class="tags">${it.tags.map(tagChip).join("")}</div>` : ""}
      ${photoKey(it) && photoKey(it) !== opts.hero ? pic(photoKey(it), it.title) : ""}
      ${it.desc ? `<p class="desc">${it.desc}</p>` : ""}
      ${it.tip ? `<p class="tip">${SUG}<span>${it.tip}</span></p>` : ""}
      ${it.note ? `<p class="unote">${ico("pencil")}<span>${esc(it.note)}</span></p>` : ""}
      ${linksOf(it)}
    </div>
    <button class="more" data-edit="${it.id}" aria-label="עריכה: ${esc(it.title)}">${ico("pencil")}</button>
  </li>`;
}
function editor(it) {
  const isNew = String(it.id).startsWith("new:");
  const custom = !BASE.has(it.id);
  const f = S.draft || {};
  return `<form class="ed" data-form="${esc(it.id)}">
    ${it.noTime ? "" : `<label>שעה<input id="ed-time" name="time" type="time" value="${esc(f.time ?? it.time ?? "")}"></label>`}
    <label class="grow">${esc(it.titleLabel || "מה")}<input id="ed-title" name="title" required value="${esc(f.title ?? it.title ?? "")}"></label>
    ${it.noNote ? "" : `<label class="full">הערה<textarea id="ed-note" name="note" rows="2">${esc(f.note ?? it.note ?? "")}</textarea></label>`}
    <div class="edact">

      <button type="button" class="ghost" data-cancel>ביטול</button>

    </div>
    ${!isNew && !custom && (it.title !== BASE.get(it.id).title || it.time !== BASE.get(it.id).time || it.hidden) ? `<button type="button" class="linkbtn reset" data-reset="${esc(it.id)}">החזרה לגרסה המקורית</button>` : ""}
  </form>`;
}
function addRow(list, label, noTime, opts = {}) {
  const key = "new:" + list;

const credit = P => `צילום: <bdi>${esc(P.by)}</bdi>, רישיון <bdi>${esc(P.lic)}</bdi>`;

function openPhoto(k, title, from) {
  const P = DATA.photos[k], dlg = $("#lb"); if (!P || !dlg) return;

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e;
    show(`${icon}<p><b>אפשר להתקין את הטיול כאפליקציה</b>, והיא תעבוד גם בלי אינטרנט.</p><button class="primary" data-install-go>התקנה</button>${close}`);
  });
  window.addEventListener("appinstalled", () => { box.hidden = true; });
  box.addEventListener("click", async e => {
    if (e.target.closest("[data-install-x]")) { box.hidden = true; store.set("installDismissed", true); }
    if (e.target.closest("[data-install-go]") && deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; box.hidden = true; }
  });
})();
</script>
</body>
</html>
